<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — CMS Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../assets/icons/Abdullah%20Zafar%20Favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-shell">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-brand">
            <div class="sidebar-brand-logo">AZ</div>
            <div class="sidebar-brand-text">Blog CMS<span class="sidebar-brand-sub">abdullahzafar.me</span></div>
        </div>
        <nav class="sidebar-nav">
            <p class="nav-section-label">Main</p>
            <a href="/admin/" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
            <p class="nav-section-label">Content</p>
            <a href="/admin/posts.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>All Posts</a>
            <a href="/admin/editor.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>New Post</a>
            <a href="/admin/categories.html" class="sidebar-link active"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/></svg>Categories</a>
            <p class="nav-section-label">System</p>
            <a href="/admin/settings.html" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Settings</a>
            <a href="/" target="_blank" class="sidebar-link"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>View Website</a>
        </nav>
        <div class="sidebar-footer">
            <div class="admin-user-info">
                <div class="admin-avatar">AZ</div>
                <div class="admin-user-text">
                    <span class="admin-user-name" data-admin-name>Abdullah Zafar</span>
                    <span class="admin-user-email" data-admin-email>admin</span>
                </div>
            </div>
            <button class="btn-logout" data-logout>
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                Sign Out
            </button>
        </div>
    </aside>

    <!-- TOPBAR -->
    <header class="admin-topbar">
        <button class="topbar-hamburger" aria-label="Menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="topbar-title">Blog Categories</span>
    </header>

    <!-- MAIN -->
    <main class="admin-main">
        <div style="display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start">
            
            <!-- Left: Add/Edit Category Form -->
            <div class="admin-card">
                <h2 style="font-family:var(--font-heading);font-size:16px;font-weight:600;margin-bottom:16px" id="formTitle">Add New Category</h2>
                <form id="categoryForm">
                    <input type="hidden" id="categoryId">
                    
                    <div class="form-group">
                        <label class="form-label" for="catName">Category Name <span>*</span></label>
                        <input type="text" id="catName" class="form-input" placeholder="e.g. Technical SEO" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="catSlug">Slug <span>*</span></label>
                        <input type="text" id="catSlug" class="form-input" placeholder="technical-seo" required>
                        <div class="form-hint">Archive URL: /blog/category/<span>technical-seo</span></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="catDesc">Description</label>
                        <textarea id="catDesc" class="form-textarea" rows="3" placeholder="Category summary displayed at the top of the archive page…"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="catSeoTitle">SEO Title (Optional)</label>
                        <input type="text" id="catSeoTitle" class="form-input" placeholder="Custom category meta title">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="catSeoDesc">SEO Meta Description (Optional)</label>
                        <textarea id="catSeoDesc" class="form-textarea" rows="2" placeholder="Custom category meta description"></textarea>
                    </div>

                    <div style="display:flex;gap:8px;margin-top:20px">
                        <button type="submit" class="btn btn-primary" id="saveCatBtn" style="flex:1">Save Category</button>
                        <button type="button" class="btn btn-secondary" id="cancelCatBtn" style="display:none">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Right: Categories Table -->
            <div class="admin-card">
                <h2 style="font-family:var(--font-heading);font-size:16px;font-weight:600;margin-bottom:16px">All Categories</h2>
                <div id="categoriesTableWrap">
                    <div class="page-loader"><div class="spinner"></div></div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-utils.js"></script>
<script src="js/admin-categories.js"></script>
</body>
</html>
