    <line x1="100" y1="0" x2="150" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4 4"/>

    <circle cx="200" cy="0" r="36" fill="rgba(255,81,71,0.15)" stroke="#ff5147" stroke-width="2"/>
