    <text x="-250" y="7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">01</text>
    
    <line x1="-200" y1="0" x2="-150" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="4 4"/>
    
