<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5147"/>
      <stop offset="100%" stop-color="#ff766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="16"/>
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8" rx="12"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Center SEO Illustration -->
  <g transform="translate(600, 260)">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="75" fill="rgba(255,81,71,0.1)"/>
    <circle cx="0" cy="0" r="55" fill="rgba(255,81,71,0.18)"/>
    <!-- Magnifying Glass / Search & Ranking Icon -->
    <path d="M-15 -15 L15 15" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-10" cy="-10" r="28" fill="none" stroke="url(#accentGrad)" stroke-width="6"/>
    <!-- Trend Bar Indicators -->
    <line x1="50" y1="20" x2="50" y2="-10" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="68" y1="20" x2="68" y2="-30" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
    <line x1="86" y1="20" x2="86" y2="-50" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="600" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Why SEO Matters for Faisalabad Businesses
  </text>
  <text x="600" y="465" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Local Search Visibility &bull; Map Pack &bull; Organic Click Capture
  </text>
  <rect x="520" y="505" width="160" height="34" rx="17" fill="rgba(255,81,71,0.15)" stroke="#ff5147" stroke-width="1.5"/>
  <text x="600" y="527" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ff5147" text-anchor="middle" letter-spacing="1">
    IMAGE PLACEHOLDER
  </text>
</svg>
