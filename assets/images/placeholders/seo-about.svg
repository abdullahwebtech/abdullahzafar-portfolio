<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5147"/>
      <stop offset="100%" stop-color="#ff766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgGrad)" rx="16"/>
  <rect x="20" y="20" width="760" height="760" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8" rx="12"/>

  <!-- Avatar / Specialist Icon -->
  <g transform="translate(400, 320)">
    <circle cx="0" cy="0" r="90" fill="rgba(255,81,71,0.12)" stroke="#ff5147" stroke-width="2"/>
    <circle cx="0" cy="-25" r="35" fill="none" stroke="url(#accentGrad)" stroke-width="4"/>
    <path d="M-55 50 C-55 15, 55 15, 55 50" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
    Abdullah Zafar
  </text>
  <text x="400" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    SEO Expert &amp; Web Developer in Faisalabad
  </text>

  <rect x="320" y="540" width="160" height="34" rx="17" fill="rgba(255,81,71,0.15)" stroke="#ff5147" stroke-width="1.5"/>
  <text x="400" y="562" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ff5147" text-anchor="middle" letter-spacing="1">
    IMAGE PLACEHOLDER
  </text>
</svg>
