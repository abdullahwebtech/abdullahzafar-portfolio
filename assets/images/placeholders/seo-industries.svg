<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bgGrad)" rx="16"/>
  <rect x="20" y="20" width="1160" height="635" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="8 8" rx="12"/>

  <!-- Industries Grid Graphic -->
  <g transform="translate(600, 240)">
    <!-- 6 Industry Badges -->
    <rect x="-380" y="-70" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="-270" y="-33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🏥 Clinics &amp; Healthcare</text>

    <rect x="-110" y="-70" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="0" y="-33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🎓 Academies &amp; Tuition</text>

    <rect x="160" y="-70" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="270" y="-33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🧵 Textile &amp; Garments</text>

    <rect x="-380" y="10" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="-270" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🛍️ Retail &amp; Brands</text>

    <rect x="-110" y="10" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🏢 Real Estate Agents</text>

    <rect x="160" y="10" width="220" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="270" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">🚢 Exporters &amp; B2B</text>
  </g>

  <!-- Text -->
  <text x="600" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">
    Industries &amp; Niches I Work With
  </text>
  <text x="600" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.6)" text-anchor="middle">
    Tailored SEO Strategies for Faisalabad Businesses and B2B Exporters
  </text>
  <rect x="520" y="485" width="160" height="34" rx="17" fill="rgba(255,81,71,0.15)" stroke="#ff5147" stroke-width="1.5"/>
  <text x="600" y="507" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ff5147" text-anchor="middle" letter-spacing="1">
    IMAGE PLACEHOLDER
  </text>
</svg>
